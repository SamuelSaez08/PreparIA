# Plantilla de variables de entorno para Cloud Run.
#
#   1. Copia este archivo como  env.cloudrun.yaml
#   2. Rellena los valores reales
#   3. Despliega con:  gcloud run deploy ... --env-vars-file env.cloudrun.yaml
#
# env.cloudrun.yaml está en .gitignore y en .gcloudignore: no se sube al
# repositorio ni al paquete de origen. Aun así, los valores quedan visibles
# en la consola de Cloud Run — para un proyecto real conviene mover los tres
# secretos a Secret Manager.
#
# Ojo: --env-vars-file REEMPLAZA todas las variables en cada despliegue.
# Lo que no esté aquí, desaparece.

# ── Base de datos (Supabase) ──────────────────────────────────────────
DATABASE_URL: "postgresql://postgres.eajateyhrufsggshxppq:SamUeL%232005SaEz@aws-1-us-west-2.pooler.supabase.com:6543/postgres"
DB_SSL: "true"

# Pool pequeño a propósito: Cloud Run puede levantar varias instancias y
# cada una abre su propio pool. Con max-instances 4 y 5 conexiones por
# instancia son 20 como máximo, dentro de lo que aguanta Supabase.
PG_MAX_POOL: "5"

# ── Seguridad ─────────────────────────────────────────────────────────
JWT_SECRET: "preparia_super_secret_key_cambiar_en_produccion"
JWT_EXPIRES_IN: "8h"
BCRYPT_SALT_ROUNDS: "12"
SESSION_IDLE_MINUTES: "30"

# Cloud Run pone un proxy delante. Sin esto todos los usuarios
# comparten el mismo cupo de peticiones.
TRUST_PROXY: "1"
RATE_LIMIT_MAX: "300"
RATE_LIMIT_AUTH_MAX: "20"

# ── Entorno ───────────────────────────────────────────────────────────
NODE_ENV: "production"
FRONTEND_URL: "https://prepar-ia.vercel.app"
CORS_ORIGIN: "https://prepar-ia.vercel.app"

# ── IA ────────────────────────────────────────────────────────────────
GEMINI_API_KEY: "AIzaSyD27OOBlHoPRG4uQX9SJRkset3t6G23ar0"
GEMINI_MODEL: "gemini-2.5-flash"
GEMINI_MAX_TOKENS: "8192"
GEMINI_TEMPERATURE: "0.7"
IA_TEMAS_POR_SIMULACRO: "4"
