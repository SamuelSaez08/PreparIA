<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreparIA — Ciencias Sociales</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/clay.css?v=2.1.0">
  <style>
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .search-nodes {
      background: var(--ink-muted);
      border: 2px solid rgba(245, 245, 240, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--white);
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-nodes:focus {
      border-color: var(--acid);
    }

    .search-nodes::placeholder {
      color: rgba(245, 245, 240, 0.3);
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .icon-btn {
      background: var(--ink-muted);
      border: 2px solid rgba(245, 245, 240, 0.15);
      border-radius: var(--radius-sm);
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover,
    .icon-btn.selected {
      border-color: var(--acid);
      background: var(--acid-glow);
    }

    #new-node-label,
    #new-node-icon-display {
      background: var(--ink-muted);
      border: 2px solid rgba(245, 245, 240, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--white);
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    #new-node-label:focus {
      border-color: var(--acid);
    }

    .node-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--acid-glow);
      color: var(--acid);
      border: 1px solid var(--acid);
      border-radius: 100px;
      padding: 2px 10px;
      font-size: 0.875rem;
      font-weight: 800;
    }

    .highlight {
      color: var(--acid);
      background: rgba(191, 255, 0, 0.15);
      border-radius: 3px;
      padding: 0 2px;
    }

    /* ── Node Type Selector Dropdown ── */
    #node-type-selector {
      display: none;
      position: fixed;
      z-index: 9999;
      background: #0d0d1a;
      border: 2.5px solid var(--acid);
      border-radius: var(--radius-md);
      box-shadow: 4px 4px 0 var(--acid), 0 20px 60px rgba(0, 0, 0, 0.7);
      padding: 10px;
      min-width: 230px;
      font-family: var(--font);
    }

    #node-type-selector.visible {
      display: block !important;
      animation: nts-in 0.16s ease forwards;
    }

    @keyframes nts-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nts-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: rgba(245, 245, 240, 0.38);
      padding: 2px 6px 8px;
      border-bottom: 1px solid rgba(245, 245, 240, 0.08);
      margin-bottom: 6px;
    }

    .nts-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      background: transparent;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      padding: 10px 10px;
      cursor: pointer;
      font-family: var(--font);
      color: var(--white);
      text-align: left;
      transition: background 0.13s, border-color 0.13s;
    }

    .nts-btn:hover {
      background: var(--acid-glow);
      border-color: var(--acid);
    }

    .nts-icon {
      font-size: 1.35rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .nts-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nts-name {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .nts-desc {
      font-size: 0.7rem;
      color: rgba(245, 245, 240, 0.42);
      line-height: 1.3;
    }

    /* Selected node indicator */
    .tree-node-header.node-selected {
      border-left: 3px solid var(--acid);
      padding-left: calc(12px - 3px);
      background: rgba(191, 255, 0, 0.05);
    }

    /* ══════════════════════════════════════════════════════════
       RUTA DE APRENDIZAJE
       Camino en curva con nodos de vidrio. El color comunica
       dominio, no permiso: aquí no se bloquea nada, y por eso
       ningún nodo lleva candado.
       ══════════════════════════════════════════════════════════ */
    .vista-toggle {
      display: inline-flex;
      background: var(--ink-soft);
      border: 2px solid rgba(245,245,240,0.12);
      border-radius: 100px;
      padding: 4px; gap: 4px;
    }
    .vista-toggle button {
      border: none; background: none; cursor: pointer;
      font-family: var(--font); font-weight: 700; font-size: 0.875rem;
      color: rgba(245,245,240,0.55);
      padding: 8px 18px; border-radius: 100px;
      transition: all var(--transition);
    }
    .vista-toggle button:hover { color: var(--white); }
    .vista-toggle button.activa { background: var(--acid); color: var(--ink); }

    .ruta { max-width: 620px; margin: 0 auto; }
    .ruta-etapa { margin-bottom: 60px; }

    /* ── Banner de etapa ── */
    .ruta-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px; flex-wrap: wrap;
      background: linear-gradient(135deg, var(--acid-dark), var(--acid));
      color: var(--ink);
      border-radius: var(--radius-lg);
      padding: 18px 24px;
      box-shadow: 0 10px 30px -12px rgba(191,255,0,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
      position: sticky; top: 12px; z-index: 6;
    }
    .ruta-banner-eyebrow {
      font-size: 0.875rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; opacity: 0.6; margin: 0 0 2px;
    }
    .ruta-banner h3 { font-size: 1.3rem; font-weight: 800; margin: 0; line-height: 1.2; }
    .ruta-banner-avance { text-align: right; line-height: 1.1; }
    .ruta-banner-cifra { display: block; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .ruta-banner-pista { font-size: 0.875rem; font-weight: 700; opacity: 0.62; }

    /* ── Camino ── */
    .ruta-camino {
      list-style: none; margin: 0; padding: 44px 0 8px;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
      position: relative;
    }
    .ruta-trazo {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none; overflow: visible;
    }
    .ruta-trazo .tramo {
      fill: none; stroke-width: 13; stroke-linecap: round;
    }
    .ruta-trazo .tramo-halo {
      fill: none; stroke: var(--acid); stroke-width: 24;
      stroke-linecap: round; opacity: 0.14;
    }

    .ruta-paso {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      transform: translateX(var(--x, 0));
      max-width: 200px; text-align: center;
    }
    .ruta-paso:has(.siguiente) { margin-top: 16px; }

    /* ── Nodo: tarjeta de vidrio con disco dentro ── */
    .ruta-nodo {
      position: relative;
      width: 92px; height: 92px;
      border-radius: 26px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: rgba(245,245,240,0.06);
      border: 1px solid rgba(245,245,240,0.14);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 10px 26px -14px rgba(0,0,0,0.9);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .ruta-nodo:hover {
      transform: translateY(-4px);
      border-color: rgba(245,245,240,0.3);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 16px 30px -14px rgba(0,0,0,0.95);
    }
    .ruta-nodo:active { transform: translateY(0); }
    .ruta-nodo:focus-visible { outline: 3px solid var(--white); outline-offset: 4px; }

    .ruta-disco {
      position: relative;
      width: 62px; height: 62px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; line-height: 1;
      background: var(--ink-muted);
      color: var(--white);
      box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    }

    .ruta-nodo.dominado .ruta-disco {
      background: linear-gradient(160deg, var(--acid), var(--acid-dark));
      color: var(--ink);
      box-shadow: 0 4px 0 rgba(90,125,0,0.9), 0 0 22px rgba(191,255,0,0.35);
    }
    .ruta-nodo.progreso .ruta-disco {
      background: var(--ink-muted);
      box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 18px rgba(255,217,61,0.18);
    }
    .ruta-nodo.vacio { opacity: 0.42; }
    .ruta-nodo.vacio .ruta-disco { background: rgba(245,245,240,0.06); color: rgba(245,245,240,0.35); }

    .ruta-nodo.siguiente {
      border-color: rgba(191,255,0,0.55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 0 4px var(--acid-glow), 0 14px 34px -14px rgba(191,255,0,0.5);
    }
    .ruta-nodo.siguiente .ruta-disco {
      background: linear-gradient(160deg, var(--acid), var(--acid-dark));
      color: var(--ink);
      box-shadow: 0 4px 0 rgba(90,125,0,0.9), 0 0 26px rgba(191,255,0,0.5);
      animation: ruta-latido 2.4s ease-in-out infinite;
    }
    @keyframes ruta-latido {
      0%, 100% { box-shadow: 0 4px 0 rgba(90,125,0,0.9), 0 0 26px rgba(191,255,0,0.5); }
      50%      { box-shadow: 0 4px 0 rgba(90,125,0,0.9), 0 0 40px rgba(191,255,0,0.75); }
    }

    .ruta-corona {
      position: absolute; top: -17px; left: 50%;
      transform: translateX(-50%) rotate(-8deg);
      font-size: 1.5rem;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6));
      pointer-events: none;
    }

    .ruta-anillo {
      position: absolute; inset: -5px;
      width: calc(100% + 10px); height: calc(100% + 10px);
      transform: rotate(-90deg); pointer-events: none;
    }
    .ruta-anillo-fondo  { fill: none; stroke: rgba(245,245,240,0.10); stroke-width: 5; }
    .ruta-anillo-avance { fill: none; stroke: var(--amber); stroke-width: 5; stroke-linecap: round; }

    .ruta-aqui {
      position: absolute; top: -36px; z-index: 2;
      background: var(--white); color: var(--ink);
      font-size: 0.875rem; font-weight: 800;
      padding: 5px 14px; border-radius: 100px;
      white-space: nowrap;
      box-shadow: 0 6px 16px -6px rgba(0,0,0,0.8);
    }
    .ruta-aqui::after {
      content: ""; position: absolute; bottom: -5px; left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 6px solid var(--white);
    }

    /* Fondo propio: el trazo pasa cerca y el texto tiene que ganar siempre */
    .ruta-etiqueta {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; gap: 3px;
      padding: 7px 12px; border-radius: 14px;
      background: rgba(10,10,26,0.82);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .ruta-practicar {
      margin-top: 5px; align-self: center;
      border: 1px solid rgba(191,255,0,0.45);
      background: rgba(191,255,0,0.10);
      color: var(--acid);
      font-family: var(--font); font-weight: 700; font-size: 0.875rem;
      padding: 5px 14px; border-radius: 100px; cursor: pointer;
      transition: all var(--transition);
    }
    .ruta-practicar:hover:not(:disabled) { background: var(--acid); color: var(--ink); }
    .ruta-practicar:disabled { opacity: 0.55; cursor: progress; }
    .ruta-practicar:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

    .ruta-nombre { font-size: 0.95rem; font-weight: 700; line-height: 1.25; color: var(--white); }
    .ruta-detalle { font-size: 0.875rem; line-height: 1.3; color: rgba(245,245,240,0.45); }

    .ruta-vacia, .ruta-mensaje {
      text-align: center; padding: 48px 20px;
      color: rgba(245,245,240,0.4); font-size: 0.95rem;
    }
    .ruta-mensaje-icono { font-size: 3rem; margin-bottom: 12px; }

    .ruta-leyenda {
      display: flex; flex-wrap: wrap; gap: 10px 22px;
      justify-content: center; margin-bottom: 26px;
      font-size: 0.875rem; color: rgba(245,245,240,0.6); font-weight: 600;
    }
    .ruta-leyenda i {
      display: inline-block; width: 13px; height: 13px; border-radius: 50%;
      margin-right: 7px; vertical-align: -1px;
    }

    @media (max-width: 768px) {
      .ruta-paso { transform: translateX(calc(var(--x, 0) * 0.6)); max-width: 165px; }
      .ruta-nodo { width: 80px; height: 80px; border-radius: 23px; }
      .ruta-disco { width: 54px; height: 54px; font-size: 1.4rem; }
      .ruta-banner h3 { font-size: 1.1rem; }
      .ruta-nombre, .ruta-detalle, .ruta-leyenda, .vista-toggle button { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ruta-nodo, .ruta-nodo.siguiente .ruta-disco { animation: none; transition: none; }
    }
  </style>
</head>

<body class="v2">

<main class="page" id="main">
  <header class="page-head">
    <div class="page-head-txt">
      <h1>Ciencias Sociales</h1>
      <p>Tu ruta hacia el ICFES, tema por tema. Elige uno para practicar con preguntas del banco.</p>
    </div>
    <div class="page-head-actions">
      <div class="vista-toggle" role="tablist" aria-label="Forma de ver los contenidos">
        <button type="button" id="btn-vista-ruta" class="activa" role="tab" aria-selected="true"><i data-icon="map" data-size="16"></i>Ruta</button>
        <button type="button" id="btn-vista-arbol" role="tab" aria-selected="false"><i data-icon="tree" data-size="16"></i>Árbol</button>
      </div>
    </div>
  </header>

  <!-- Resumen: cuántos temas domina y en qué estado están los demás -->
  <section class="clay ruta-summary" aria-label="Resumen de tu avance">
    <div class="inline" style="align-items:baseline;gap:8px">
      <span class="big-num" style="font-size:1.75rem"><span id="rs-dom">0</span><span class="t4" style="color:var(--text-5)">/<span id="rs-total">0</span></span></span>
      <span class="t3" style="font-size:.875rem;font-weight:700">temas dominados</span>
    </div>
    <div class="ruta-stack" aria-hidden="true">
      <span id="rs-bar-dom" style="flex-grow:0;background:var(--acid)"></span>
      <span id="rs-bar-prog" style="flex-grow:0;background:var(--amber)"></span>
      <span id="rs-bar-sin" style="flex-grow:1;background:#26264F"></span>
    </div>
    <div class="ruta-legend">
      <span class="status dominado">Dominado · <span id="rs-n-dom">0</span></span>
      <span class="status en_progreso">En progreso · <span id="rs-n-prog">0</span></span>
      <span class="status disponible">Sin practicar · <span id="rs-n-sin">0</span></span>
    </div>
  </section>

  <!-- ══════════ VISTA RUTA ══════════ -->
  <div id="vista-ruta">
    <div class="ruta2">
      <div id="ruta-container">
        <div class="ruta-mensaje">Cargando tu ruta…</div>
      </div>
      <aside id="ruta-panel" class="feat ruta2-panel" aria-live="polite" hidden></aside>
    </div>
  </div>

  <!-- ══════════ VISTA ÁRBOL ══════════ -->
  <div id="vista-arbol" hidden>
    <div class="stack gap-20">
      <div class="between" style="flex-wrap:wrap">
        <input type="search" class="search-nodes" id="tree-search" style="max-width:520px"
          placeholder="Buscar un tema (Ej: Simón Bolívar, PIB, Amazonía)" aria-label="Buscar un tema en el árbol">
        <!-- Controles de edición del árbol: solo administradores (RF-04) -->
        <div class="page-head-actions" data-admin-only hidden>
          <button onclick="PageCienciasSociales.expandAll()" class="btn btn-secondary btn-sm">Expandir todo</button>
          <button onclick="PageCienciasSociales.collapseAll()" class="btn btn-secondary btn-sm">Colapsar</button>
          <button id="reset-tree-btn" class="btn btn-danger btn-sm"><i data-icon="refresh" data-size="16"></i>Reiniciar</button>
        </div>
      </div>

      <div class="clay" style="padding:16px">
        <div id="tree-container" class="tree-container"></div>
      </div>

      <div class="kpis" style="--cols:4">
        <div class="clay kpi"><span class="lbl">Categorías</span><span class="big-num" id="count-cats">—</span></div>
        <div class="clay kpi"><span class="lbl">Temas totales</span><span class="big-num" id="count-total">—</span></div>
        <div class="clay kpi"><span class="lbl">Nodos personalizados</span><span class="big-num" id="count-custom">0</span></div>
        <button type="button" class="clay kpi lift" id="add-node-card" style="display:none;cursor:pointer;text-align:left;font-family:inherit;color:inherit"
          onclick="PageCienciasSociales.showNodeTypeSelector()">
          <span class="lbl">Agregar nodo</span><span class="big-num" style="color:var(--amber)">+</span>
        </button>
      </div>
    </div>
  </div>
</main>

  <!-- ── MODAL: Add Node ── -->
  <div class="modal-overlay" id="add-node-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>➕ Agregar nodo</h3>
        <button class="modal-close" data-close-modal="add-node-modal">✕</button>
      </div>
      <input type="hidden" id="new-node-parent">
      <div class="flex flex-col gap-lg">
        <div class="input-group">
          <label>Nombre del tema</label>
          <input type="text" id="new-node-label" placeholder="Ej: Revolución de los Comuneros" maxlength="60">
        </div>
        <div class="input-group" id="parent-category-group">
          <label id="parent-category-label">Categoría principal</label>
          <div class="icon-grid" id="parent-category-selector">
            <!-- Emojis will be injected here dynamically -->
          </div>
        </div>
        <div class="input-group">
          <label>Contenido del tema</label>
          <textarea id="new-node-content" placeholder="Escribe el contenido educativo aquí..." rows="4"
            style="background: var(--ink-muted); border: 2px solid rgba(245,245,240,0.2); border-radius: var(--radius-md); padding: 12px 16px; font-family: var(--font); font-size: 0.95rem; color: var(--white); width: 100%; outline: none; transition: border-color 0.2s; resize: vertical;"></textarea>
        </div>
        <div class="flex gap-md">
          <button class="btn btn-outline w-full" data-close-modal="add-node-modal">Cancelar</button>
          <button id="save-node-btn" class="btn btn-primary w-full">Agregar ✓</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── MODAL: Node Content ── -->
  <div class="modal-overlay" id="node-content-modal">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="node-content-title">📌 Título</h3>
        <button class="modal-close" data-close-modal="node-content-modal">✕</button>
      </div>
      <div class="flex flex-col gap-lg" id="node-content-body"
        style="font-size: 0.95rem; line-height: 1.6; color: rgba(245,245,240,0.85);">
        <!-- Content will be injected here -->
        Cargando...
      </div>
      <div class="mt-lg flex justify-end">
        <button class="btn btn-primary btn-sm" data-close-modal="node-content-modal">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- ── NODE TYPE SELECTOR DROPDOWN ── -->
  <div id="node-type-selector" role="menu" aria-label="Tipo de nodo">
    <div class="nts-title">¿Tipo de nodo?</div>
    <button class="nts-btn" onclick="PageCienciasSociales.handleNodeTypeChoice('padre')" role="menuitem">
      <span class="nts-icon">🌳</span>
      <div class="nts-text">
        <span class="nts-name">Nodo padre</span>
        <span class="nts-desc">Nivel raíz o superior al seleccionado</span>
      </div>
    </button>
    <button class="nts-btn" onclick="PageCienciasSociales.handleNodeTypeChoice('hijo')" role="menuitem">
      <span class="nts-icon">🌿</span>
      <div class="nts-text">
        <span class="nts-name">Nodo hijo</span>
        <span class="nts-desc">Subtema del nodo seleccionado</span>
      </div>
    </button>
  </div>


  <script src="js/config.js?v=2.1.0"></script>
  <script src="js/api.js?v=2.1.0"></script>
  <script src="js/state.js?v=2.1.0"></script>
  <script src="js/ui.js?v=2.1.0"></script>
  <script src="js/shell.js?v=2.1.0"></script>
  <script src="js/progreso-ruta.js?v=2.1.0"></script>
  <script src="js/ruta.js?v=2.1.0"></script>
  <script src="js/pages/page-ciencias-sociales.js?v=2.1.0"></script>
  <script src="js/app.js?v=2.1.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Search functionality
      const searchInput = document.getElementById('tree-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.trim().toLowerCase();
          const headers = document.querySelectorAll('.tree-node-header');

          if (!query) {
            headers.forEach(h => {
              h.closest('.tree-node')?.style.removeProperty('display');
              const label = h.querySelector('.tree-node-label');
              if (label) label.innerHTML = label.textContent;
            });
            return;
          }

          headers.forEach(h => {
            const node = h.closest('.tree-node');
            const label = h.querySelector('.tree-node-label');
            if (!label || !node) return;
            const text = label.textContent.toLowerCase();
            const match = text.includes(query);
            node.style.display = match ? '' : 'none';
            if (match) {
              // Expand parent
              let parent = node.parentElement;
              while (parent) {
                if (parent.classList.contains('tree-node-children')) {
                  parent.classList.add('open');
                  parent.previousElementSibling?.classList.add('open');
                }
                parent = parent.parentElement;
              }
              // Highlight
              const orig = label.textContent;
              const idx = orig.toLowerCase().indexOf(query);
              label.innerHTML = orig.slice(0, idx) +
                `<span class="highlight">${orig.slice(idx, idx + query.length)}</span>` +
                orig.slice(idx + query.length);
            }
          });
        });
      }

      // Count nodes
      setTimeout(() => {
        const total = document.querySelectorAll('.tree-node-header').length;
        const custom = document.querySelectorAll('.badge-sky').length;
        const catsEl = document.getElementById('count-cats');
        if (catsEl) catsEl.textContent = document.querySelectorAll('#tree-container > .tree-node').length;
        const totalEl = document.getElementById('count-total');
        const customEl = document.getElementById('count-custom');
        if (totalEl) totalEl.textContent = total;
        if (customEl) customEl.textContent = custom;
      }, 200);
    });
  </script>
</body>

</html>
