<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PreparIA — Inicio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A1A">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="css/clay.css?v=2.1.0">
</head>
<body class="v2" data-racha-propia>

<main class="page" id="main">

  <header class="page-head">
    <div class="page-head-txt">
      <h1>Hola, <span data-user-name>Estudiante</span></h1>
      <p id="greeting-sub">Preparando tu resumen…</p>
    </div>
    <div class="page-head-actions">
      <a href="simulacros.html" class="btn btn-secondary"><i data-icon="clip"></i><span>Hacer simulacro</span></a>
    </div>
  </header>

  <div class="grid-2-1">
    <!-- La única tarjeta destacada: el siguiente paso -->
    <section class="feat card-pad stack gap-20" id="continuar" aria-labelledby="cont-t" style="padding:30px 32px">
      <div class="between">
        <span class="lbl acid" id="cont-t">Continúa tu ruta</span>
      </div>
      <div class="stack gap-12">
        <div class="skel" style="height:80px"></div>
        <div class="skel" style="height:12px;width:70%"></div>
      </div>
    </section>

    <section class="clay card-pad stack gap-16" aria-labelledby="racha-t">
      <div class="between">
        <span class="lbl" id="racha-t">Racha de estudio</span>
        <span style="color:var(--amber);display:flex"><i data-icon="flame" data-size="22"></i></span>
      </div>
      <div class="inline" style="align-items:baseline;gap:10px">
        <span class="big-num" style="font-size:3.5rem;letter-spacing:-0.04em" id="streak-count">0</span>
        <span class="t3" style="font-size:1.0625rem;font-weight:700" id="streak-unit">días seguidos</span>
      </div>
      <div class="week" id="streak-days" aria-label="Actividad de los últimos 7 días"></div>
      <p class="t3" style="font-size:.875rem;line-height:1.5" id="streak-msg"></p>
    </section>
  </div>

  <div class="kpis" style="--cols:3">
    <div class="clay kpi">
      <span class="lbl">Simulacros hechos</span>
      <span class="big-num" id="stat-simulacros">—</span>
      <small id="stat-simulacros-sub">&nbsp;</small>
    </div>
    <div class="clay kpi">
      <span class="lbl">Puntaje promedio</span>
      <span class="big-num" id="stat-promedio">—</span>
      <small id="stat-promedio-sub">Meta recomendada: 70%</small>
    </div>
    <a href="ranking.html" class="clay kpi lift">
      <span class="between"><span class="lbl">Tu posición</span><span class="chev" style="color:var(--text-5)"><i data-icon="chev" data-size="18"></i></span></span>
      <span class="big-num" id="stat-rank">—</span>
      <small id="stat-rank-sub">en el ranking de la semana</small>
    </a>
  </div>

  <div class="grid-3-2">
    <section class="clay stack gap-4" aria-labelledby="unid-t" style="padding:24px 16px 12px">
      <div class="between" style="padding:0 12px 8px">
        <h2 id="unid-t">Progreso por unidad</h2>
        <span class="t4" style="font-size:.8125rem;font-weight:600">Ciencias Sociales</span>
      </div>
      <div id="unidades" class="stack gap-4">
        <div class="skel" style="height:56px;margin:0 12px"></div>
        <div class="skel" style="height:56px;margin:0 12px"></div>
        <div class="skel" style="height:56px;margin:0 12px"></div>
      </div>
    </section>

    <section class="clay card-pad stack gap-16" aria-labelledby="ult-t" id="ultimo">
      <h2 id="ult-t">Último simulacro</h2>
      <div id="recent-simulacros" class="stack gap-16" style="flex-grow:1">
        <div class="skel" style="height:44px;width:60%"></div>
      </div>
    </section>
  </div>

</main>

<script src="js/config.js?v=2.1.0"></script>
<script src="js/api.js?v=2.1.0"></script>
<script src="js/state.js?v=2.1.0"></script>
<script src="js/ui.js?v=2.1.0"></script>
<script src="js/shell.js?v=2.1.0"></script>
<script src="js/progreso-ruta.js?v=2.1.0"></script>
<script src="js/ruta.js?v=2.1.0"></script>
<script src="js/pages/page-dashboard.js?v=2.1.0"></script>
<script src="js/app.js?v=2.1.0"></script>
</body>
</html>
