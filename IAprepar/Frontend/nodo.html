<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreparIA — Contenido del Nodo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Node Content Page ── */
    .node-page-hero {
      position: relative;
      padding: 48px 0 32px;
      border-bottom: 2px solid rgba(245, 245, 240, 0.08);
      margin-bottom: 40px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .node-page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 60%, rgba(191, 255, 0, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(78, 205, 196, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .node-icon-large {
      width: 72px;
      height: 72px;
      background: var(--acid-glow);
      border: 3px solid var(--acid);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: var(--shadow-solid-sm);
      margin-bottom: 20px;
      animation: fade-in-up 0.5s ease forwards;
    }

    .node-title {
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      animation: fade-in-up 0.5s ease forwards;
      animation-delay: 0.1s;
      opacity: 0;
    }

    .node-breadcrumb-path {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      animation: fade-in-up 0.5s ease forwards;
      animation-delay: 0.15s;
      opacity: 0;
    }

    .node-breadcrumb-path .crumb {
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(245, 245, 240, 0.45);
      transition: color 0.2s;
    }

    .node-breadcrumb-path .crumb:hover {
      color: var(--acid);
    }

    .node-breadcrumb-path .crumb-sep {
      font-size: 0.7rem;
      color: rgba(245, 245, 240, 0.2);
    }

    .node-breadcrumb-path .crumb.active {
      color: var(--acid);
    }

    .node-meta-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      animation: fade-in-up 0.5s ease forwards;
      animation-delay: 0.2s;
      opacity: 0;
    }

    .node-meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--ink-muted);
      border: 1px solid rgba(245, 245, 240, 0.1);
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(245, 245, 240, 0.6);
    }

    .node-meta-chip.custom {
      background: rgba(78, 205, 196, 0.1);
      border-color: var(--sky);
      color: var(--sky);
    }

    /* ── Content Card ── */
    .node-content-card {
      background: var(--ink-soft);
      border: 2px solid rgba(245, 245, 240, 0.1);
      border-radius: var(--radius-xl);
      padding: 40px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-clay);
      animation: fade-in-up 0.6s ease forwards;
      animation-delay: 0.25s;
      opacity: 0;
    }

    .node-content-card h4 {
      color: var(--acid);
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(191, 255, 0, 0.15);
    }

    .node-content-text {
      font-size: 1.02rem;
      line-height: 1.85;
      color: rgba(245, 245, 240, 0.85);
      font-weight: 400;
      max-width: 800px;
    }

    .node-content-text p {
      margin-bottom: 16px;
      font-size: 1.02rem;
      line-height: 1.85;
      color: rgba(245, 245, 240, 0.85);
    }

    /* ── Empty / Loading States ── */
    .node-loading {
      text-align: center;
      padding: 80px 20px;
    }

    .node-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(245, 245, 240, 0.1);
      border-top-color: var(--acid);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .node-empty {
      text-align: center;
      padding: 80px 20px;
      color: rgba(245, 245, 240, 0.35);
    }

    .node-empty .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    /* ── Children List ── */
    .node-children-section {
      margin-top: 40px;
      animation: fade-in-up 0.6s ease forwards;
      animation-delay: 0.35s;
      opacity: 0;
    }

    .node-children-title {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(245, 245, 240, 0.45);
      margin-bottom: 16px;
    }

    .node-child-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--ink-soft);
      border: 2px solid rgba(245, 245, 240, 0.08);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--white);
    }

    .node-child-item:hover {
      border-color: var(--acid);
      background: var(--acid-glow);
      transform: translateX(6px);
    }

    .node-child-icon {
      width: 40px;
      height: 40px;
      background: var(--ink-muted);
      border: 2px solid rgba(245, 245, 240, 0.12);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .node-child-item:hover .node-child-icon {
      background: var(--acid-glow);
      border-color: var(--acid);
    }

    .node-child-label {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .node-child-arrow {
      margin-left: auto;
      color: rgba(245, 245, 240, 0.2);
      font-size: 0.8rem;
      transition: color 0.2s, transform 0.2s;
    }

    .node-child-item:hover .node-child-arrow {
      color: var(--acid);
      transform: translateX(4px);
    }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--ink-muted);
      border: 2px solid rgba(245, 245, 240, 0.15);
      border-radius: var(--radius-md);
      color: var(--white);
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      margin-bottom: 24px;
    }

    .back-btn:hover {
      border-color: var(--acid);
      background: var(--acid-glow);
      color: var(--acid);
    }

    .back-btn .arrow {
      transition: transform 0.2s;
    }

    .back-btn:hover .arrow {
      transform: translateX(-4px);
    }

    @media (max-width: 768px) {
      .node-content-card {
        padding: 24px 20px;
      }

      .node-page-hero {
        padding: 32px 0 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">Prepar<span>IA</span></a>
      <div class="flex items-center gap-md">
        <span style="font-size:0.85rem;color:rgba(245,245,240,0.5)">Hola, <strong data-user-name
            style="color:var(--white)">Estudiante</strong></span>
        <button id="logout-btn" class="btn btn-outline btn-sm">Salir</button>
      </div>
    </div>
  </nav>

  <div class="app-layout">
    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Principal</div>
        <a href="dashboard.html" class="sidebar-item" data-nav="dashboard.html">
          <span class="icon">🏠</span> Inicio
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Materias</div>
        <a href="ciencias-sociales.html" class="sidebar-item active" data-nav="ciencias-sociales.html">
          <span class="icon">🌍</span> Ciencias Sociales
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Práctica</div>
        <a href="simulacros.html" class="sidebar-item" data-nav="simulacros.html">
          <span class="icon">📝</span> Simulacros
        </a>
        <a href="estadisticas.html" class="sidebar-item" data-nav="estadisticas.html">
          <span class="icon">📊</span> Estadísticas
        </a>
      </div>
    </aside>

    <!-- ── MAIN CONTENT ── -->
    <main class="main-content">
      <!-- Back Button -->
      <a href="ciencias-sociales.html" class="back-btn" id="back-btn">
        <span class="arrow">←</span> Volver al árbol
      </a>

      <!-- Node Hero Area -->
      <div class="node-page-hero" id="node-hero">
        <div class="node-breadcrumb-path" id="node-breadcrumb">
          <a href="dashboard.html" class="crumb">Inicio</a>
          <span class="crumb-sep">→</span>
          <a href="ciencias-sociales.html" class="crumb">Ciencias Sociales</a>
          <span class="crumb-sep">→</span>
          <span class="crumb active" id="breadcrumb-current">Cargando...</span>
        </div>
        <div class="node-icon-large" id="node-icon">📌</div>
        <h1 class="node-title" id="node-title">Cargando...</h1>
        <div class="node-meta-bar" id="node-meta">
          <!-- Meta chips injected here -->
        </div>
      </div>

      <!-- Node Content Area (material de estudio) -->
      <div id="node-content-area">
        <div class="node-loading">
          <div class="spinner"></div>
          <p style="font-weight:600;color:rgba(245,245,240,0.5)">Cargando contenido…</p>
        </div>
      </div>

      <!-- Children List -->
      <div class="node-children-section" id="node-children-section" style="display:none;">
        <div class="node-children-title">📚 Subtemas</div>
        <div id="node-children-list"></div>
      </div>

      <!-- Node Navigation -->
      <div class="node-navigation" id="node-navigation"
        style="display:none; margin-top: 48px; padding-top: 24px; border-top: 2px solid rgba(245, 245, 240, 0.08); align-items: center; justify-content: space-between; gap: 16px;">
        <button id="btn-prev-node" class="btn btn-outline"
          style="max-width: 48%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;"></button>
        <button id="btn-next-node" class="btn btn-primary"
          style="max-width: 48%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;"></button>
      </div>
    </main>
  </div>

  <!-- Mobile Nav -->
  <nav class="mobile-nav">
    <a href="dashboard.html" class="mobile-nav-item"><span class="icon">🏠</span>Inicio</a>
    <a href="ciencias-sociales.html" class="mobile-nav-item active"><span class="icon">🌍</span>Temas</a>
    <a href="simulacros.html" class="mobile-nav-item"><span class="icon">📝</span>Simulacro</a>
    <a href="estadisticas.html" class="mobile-nav-item"><span class="icon">📊</span>Stats</a>
  </nav>

  <script src="js/config.js?v=1.0.2"></script>
  <script src="js/api.js?v=1.0.2"></script>
  <script src="js/state.js?v=1.0.2"></script>
  <script src="js/ui.js?v=1.0.2"></script>
  <script src="js/pages/page-nodo.js?v=1.0.2"></script>
  <script src="js/app.js?v=1.0.2"></script>
</body>

</html>
